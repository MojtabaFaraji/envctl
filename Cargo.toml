[package]
name = "envctl"
version = "0.1.1"
edition = "2021"
rust-version = "1.75"
description = "Manage named shell environments (variables, PATH, aliases, functions, cwd)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/example/envctl"
readme = "README.md"
keywords = ["environment", "shell", "cli", "profile"]
categories = ["command-line-utilities"]

[[bin]]
name = "envctl"
path = "src/main.rs"

[lib]
name = "envctl"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
fs2 = "0.4"
directories = "5"
dirs = "5"
once_cell = "1"
keyring = { version = "4", optional = true }
libc = "0.2"
signal-hook = "0.3"
atty = "0.2"
colored = "2"
tabled = "0.15"
strsim = "0.11"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[features]
default = ["keyring-backend"]
keyring-backend = ["dep:keyring"]